# Render Blueprint: one web service that runs the backend and serves the frontend.
# In Render: New > Blueprint > pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: chuma
    runtime: node
    plan: free
    # Leave the root directory empty. The build needs the whole repo (frontend + backend).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: gemma
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
